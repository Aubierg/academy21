version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: academy21_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-academy21}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-academy21pass}
      POSTGRES_DB: ${DB_NAME:-academy21}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-academy21}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: .
    container_name: academy21_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "5000:5000"
  frontend:
    build: ../academy21-frontend
    container_name: academy21_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
volumes:
  postgres_data:
